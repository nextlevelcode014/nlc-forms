[project]
name = "backend"
version = "0.1.0"
description = "API de triagem, atendimento e relatório de clientes — NextLevelCode"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.137.2",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "reportlab>=5.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
# As variáveis de ambiente dos testes ficam em tests/conftest.py. Aqui não dá:
# a chave `env` depende do plugin pytest-env, que não está instalado — o pytest
# ignorava o bloco em silêncio (só um warning) e a coleta quebrava.
